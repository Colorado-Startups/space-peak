id: q-03
question: Will an FAA-licensed orbital launch lift off from a US site at least 150 km from an ocean coast by the end of 2040?
resolves:
  date: 2040-12-31
  criteria: Yes if the FAA licence record and one independent launch log show an orbital launch attempt, rocket or kinetic, from a US site at least 150 km from the nearest ocean coastline.
p: 0.12
reasoning: >-
  We found an FAA Record of Decision from 2008 that backs a license for Spaceport America, an inland New Mexico site, for suborbital launch.
  We have not yet checked orbital launch from an inland site.
  The FAA Spaceports by State page lists Spaceport America in New Mexico as licensed for horizontal and vertical launch until December 14, 2028.
  The same page calls the Pacific Spaceport Complex in Alaska one of only four orbital vertical rocket launch sites in the United States.
claims: [E-04]
