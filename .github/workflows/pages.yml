name: pages

# Git Crafter's pages for this repo (Git Crafter templates/ci/README.md): the Process page and the Quality, Speed and
# Consumption page, built by Git Crafter's actions/pages from the two starter configs and published to GitHub Pages.
# Copy this file to .github/workflows/pages.yml. Keep the pin a full commit SHA with its version comment, such as # v7.0.2; Dependabot's
# github-actions entry bumps it with ci.yml's. A pull request builds the pages and runs the docs.unmapped gate, so its
# trigger lists the doc globs; only a push to main publishes.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "**/*.md"
      - "quality/**"
      - ".github/workflows/pages.yml"
      - "03_deliverables/map/**"
      - "site/**"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

# A deploy always finishes; a newer push queues behind it.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The collectors read this repo's pull requests, runs, checks and issues; a read refused is not measured.
    permissions:
      contents: read
      actions: read
      checks: read
      issues: read
      pull-requests: read
      # Dependabot's open alerts, read live on every run; without it they come from the last local snapshot.
      vulnerability-alerts: read
    steps:
      # Full history: the docs collector dates each doc against its area's last commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm

      # The site's Design and Usability metrics read the built site (params.site_dir: site/dist) and the design
      # tokens as JSON; code.test_coverage_pct runs the repo's vitest. So install, build and write the tokens first.
      - name: Build the site for the Quality collect
        run: |
          npm ci --no-audit --no-fund
          npm run build
          node quality/tokens-from-css.mjs quality/design-tokens.json site/src/styles/tokens.css site/src/styles/space-peak.css

      - uses: SoulCraft-Org/git-crafter/actions/pages@8023bd4683416f6d420bd20d137960b09c06b91e # v7.0.2
        with:
          pages: process quality
          config: quality/process/config.json
          quality-config: quality/config.json
          # Optional read-only token for the metrics that need github-admin; empty leaves them not measured.
          admin-read-token: ${{ secrets.ADMIN_READ_TOKEN }}

      # The metrics only this Mac can read come from quality/data/local.json, a --local collect committed by
      # pull request. The built page must show each one it measured as measured (quality/local-check.mjs).
      - name: Check the local metrics on the page
        run: node quality/local-check.mjs --page quality/dist/index.html quality/data/local.json

      # The site metrics in the job log, so a pull request shows what its Quality build measured.
      - name: List the site metrics
        run: |
          node -e '
            const run = JSON.parse(require("fs").readFileSync("quality/data/latest.json", "utf8"));
            const walk = (o) => Object.entries(o ?? {}).forEach(([k, v]) => /^(design|usability|tests\.axe|security\.headers|site\.|ai\.)/.test(k)
              ? console.log(k, v?.could_not_check ? `not measured: ${v.could_not_check}` : v?.value)
              : v && typeof v === "object" && walk(v));
            walk(run);'

      # The Space Peak map (03_deliverables/map) is served beside the two pages, at /map/.
      - name: Add the map
        run: mkdir -p quality/dist/map && cp 03_deliverables/map/index.html 03_deliverables/map/space_peak_map.geojson quality/dist/map/

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: quality/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
