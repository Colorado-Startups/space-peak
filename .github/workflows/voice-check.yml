name: voice-check

# Voice check on the markdown a pull request touched. Shells out to the
# SAME script the Claude Code hooks and .githooks run
# (04_tools/space_peak_lint.py), so the harness, the hooks and CI cannot
# disagree about what the rules are.
#
# It fills a real gap: those hooks never run for a web-UI PR or a cloud
# agent, which is the path least likely to have read 01_doctrine/voice.md.
on:
  pull_request:
    paths: ["**/*.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: voice-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  voice-check:
    name: voice-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Voice check changed markdown
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash .github/scripts/changed-md.sh voice
