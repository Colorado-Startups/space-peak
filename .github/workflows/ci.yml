name: ci

# The Git Crafter CI standard (templates/ci/README.md, v7.0.2). The ruleset requires one check from it, ci / ci-ok,
# plus DCO. One short job runs every Space Peak check in under a second: the claims checker (claim
# labels; it only warns), the voice lint (blocks only on dashes), the self-tests, the
# contract test and the map --check. The map check reads the website's regions.geojson at the commit
# 04_tools/space_peak_map.py pins as WEBSITE_COMMIT; --region-url prints that URL, so the pin lives
# only in the tool. No paths filter, so every pull request runs it.
# The standard job (npm ci, then astro check, astro build, vitest with v8 coverage, then Chromium and the
# Playwright axe spec over the built dist/) runs when the site's files change, or its data: the org schema and
# checks in site/src/lib/orgs/ run only there, and /about/ says CI checks every listing.
# Dependabot's github-actions entry bumps the pin.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: SoulCraft-Org/git-crafter/.github/workflows/ci-standard.yml@8023bd4683416f6d420bd20d137960b09c06b91e # v7.0.2
    with:
      short: |
        python3 -I 04_tools/space_peak_claims.py --self-test
        python3 -I 04_tools/space_peak_lint.py --self-test
        python3 -I 04_tools/space_peak_map.py --self-test
        python3 -I 04_tools/space_peak_contract_test.py
        node --test quality/collectors/space-peak.test.mjs
        curl -fsSL "$(python3 -I 04_tools/space_peak_map.py --region-url)" -o "$RUNNER_TEMP/regions.geojson"
        python3 -I 04_tools/space_peak_map.py --check --region-geojson "$RUNNER_TEMP/regions.geojson"
        git ls-files -z '*.md' | xargs -0 python3 -I 04_tools/space_peak_claims.py --register 02_substance/claims_register.md
        git ls-files -z '*.md' | xargs -0 python3 -I 04_tools/space_peak_lint.py
      standard-paths: |
        site/**
        data/**
        package.json
        package-lock.json
        .nvmrc
        wrangler.jsonc
      standard: |
        npm run check
        npm run build
        npm test
        npm run -w @spacepeak/site e2e:install
        npm run -w @spacepeak/site test:e2e
