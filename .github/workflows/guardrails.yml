name: guardrails

# The push-ruleset replacement.
#
# GitHub push rulesets apply only to private and internal repositories, so
# the two rules that would live there, "nothing under local/" and "nothing
# over the size limit", have no server-side home on a public repository.
# This job is where they live, applied by 04_tools/space_peak_files.py.
#
# REQUIRED on main (.github/rulesets/protect-main.json). It is the gate for
# web-UI, cloud-agent and fork commits, which never run .githooks.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: guardrails-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guardrails:
    name: guardrails
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Paths and sizes
        run: bash .github/scripts/tracked-paths.sh
