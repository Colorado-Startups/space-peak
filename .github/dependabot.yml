# Dependabot keeps the GitHub Actions and the site's npm packages current
# and opens a pull request when one has a known vulnerability. Low-risk
# updates are grouped to keep review light.
#
# Dependabot security updates are free and need no extra setup.
#
# npm points at the workspace root, which holds the one package-lock.json.
# An entry for site/ alone would change site/package.json without the
# lockfile and break `npm ci` (the failure in #53).
#
# No pip entry: 04_tools/ is standard library Python with no
# requirements.txt. Add one the day 04_tools/ grows a dependency.
#
# Every PR is merged by hand. See SECURITY.md.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # Wait two weeks before proposing a new release, so a compromised or broken
    # version has time to be caught upstream. Security updates skip this.
    # 14 days is Git Crafter's goal for security.dependabot_cooldown.
    cooldown:
      default-days: 14
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 14
    # A dependency joins the first group it matches, so astro comes first.
    groups:
      astro:
        patterns: ["astro", "@astrojs/*"]
      dev-minor-and-patch:
        dependency-type: "development"
        update-types: ["minor", "patch"]
