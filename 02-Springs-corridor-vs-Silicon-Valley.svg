<svg viewBox="0 0 720 560" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <rect width="720" height="560" fill="#ffffff"/>
  <title>Silicon Valley compared to the Colorado Springs corridor at the same scale</title>

  <text x="360" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a2e">Same size, different silicon</text>
  <text x="360" y="52" text-anchor="middle" font-size="12" fill="#555">Both corridors &#8776; 30 miles, north at top</text>

  <text x="180" y="92" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a2e">Silicon Valley</text>
  <text x="540" y="92" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a2e">Springs Corridor</text>

  <line x1="180" y1="110" x2="180" y2="520" stroke="#888" stroke-width="4" stroke-linecap="round"/>
  <line x1="540" y1="110" x2="540" y2="520" stroke="#888" stroke-width="4" stroke-linecap="round"/>
  <text x="180" y="545" text-anchor="middle" font-size="10" fill="#999">US-101 / El Camino Real</text>
  <text x="540" y="545" text-anchor="middle" font-size="10" fill="#999">I-25</text>

  <line x1="196" y1="135" x2="524" y2="135" stroke="#dcdfe6" stroke-width="1.5" stroke-dasharray="5 5"/>
  <line x1="196" y1="215" x2="524" y2="215" stroke="#dcdfe6" stroke-width="1.5" stroke-dasharray="5 5"/>
  <line x1="196" y1="295" x2="524" y2="295" stroke="#dcdfe6" stroke-width="1.5" stroke-dasharray="5 5"/>
  <line x1="196" y1="375" x2="524" y2="375" stroke="#dcdfe6" stroke-width="1.5" stroke-dasharray="5 5"/>
  <line x1="196" y1="465" x2="524" y2="465" stroke="#dcdfe6" stroke-width="1.5" stroke-dasharray="5 5"/>

  <circle cx="180" cy="135" r="7" fill="#fff" stroke="#666" stroke-width="2"/>
  <text x="164" y="130" text-anchor="end" font-size="13" font-weight="600" fill="#1a1a2e">Palo Alto</text>
  <text x="164" y="145" text-anchor="end" font-size="11" fill="#555">Stanford</text>
  <circle cx="540" cy="135" r="7" fill="#fff" stroke="#666" stroke-width="2"/>
  <text x="556" y="130" font-size="13" font-weight="600" fill="#1a1a2e">North gate</text>
  <text x="556" y="145" font-size="11" fill="#555">Air Force Academy</text>
  <text x="360" y="128" text-anchor="middle" font-size="10" fill="#999">the talent engine</text>

  <circle cx="180" cy="215" r="7" fill="#fff" stroke="#666" stroke-width="2"/>
  <text x="164" y="210" text-anchor="end" font-size="13" font-weight="600" fill="#1a1a2e">Mountain View</text>
  <text x="164" y="225" text-anchor="end" font-size="11" fill="#555">NASA Ames &#183; Google</text>
  <circle cx="540" cy="215" r="7" fill="#fff" stroke="#666" stroke-width="2"/>
  <text x="556" y="210" font-size="13" font-weight="600" fill="#1a1a2e">East side</text>
  <text x="556" y="225" font-size="11" fill="#555">Peterson SFB &#183; NORAD HQ</text>
  <text x="360" y="208" text-anchor="middle" font-size="10" fill="#999">the federal anchor</text>

  <circle cx="180" cy="295" r="7" fill="#fff" stroke="#666" stroke-width="2"/>
  <text x="164" y="290" text-anchor="end" font-size="13" font-weight="600" fill="#1a1a2e">Cupertino</text>
  <text x="164" y="305" text-anchor="end" font-size="11" fill="#555">Apple&#8217;s ring</text>
  <circle cx="540" cy="295" r="7" fill="#fff" stroke="#666" stroke-width="2"/>
  <text x="556" y="290" font-size="13" font-weight="600" fill="#1a1a2e">Southwest</text>
  <text x="556" y="305" font-size="11" fill="#555">Cheyenne Mountain bunker</text>
  <text x="360" y="288" text-anchor="middle" font-size="10" fill="#999">the secretive campus</text>

  <circle cx="180" cy="375" r="7" fill="#fff" stroke="#666" stroke-width="2"/>
  <text x="164" y="370" text-anchor="end" font-size="13" font-weight="600" fill="#1a1a2e">Sunnyvale</text>
  <text x="164" y="385" text-anchor="end" font-size="11" fill="#555">Lockheed Missiles &amp; Space</text>
  <circle cx="540" cy="375" r="7" fill="#fff" stroke="#666" stroke-width="2"/>
  <text x="556" y="370" font-size="13" font-weight="600" fill="#1a1a2e">Out east</text>
  <text x="556" y="385" font-size="11" fill="#555">Schriever SFB &#183; GPS ops</text>
  <text x="360" y="368" text-anchor="middle" font-size="10" fill="#999">the workhorse ops</text>

  <circle cx="180" cy="465" r="9" fill="#fff" stroke="#666" stroke-width="2.5"/>
  <text x="164" y="460" text-anchor="end" font-size="14" font-weight="700" fill="#1a1a2e">San Jose</text>
  <text x="164" y="475" text-anchor="end" font-size="11" fill="#555">biggest city, southern anchor</text>
  <circle cx="540" cy="465" r="9" fill="#fff" stroke="#666" stroke-width="2.5"/>
  <text x="556" y="460" font-size="14" font-weight="700" fill="#1a1a2e">Colorado Springs</text>
  <text x="556" y="475" font-size="11" fill="#555">downtown &#183; contractors &#183; Ft. Carson south</text>
  <text x="360" y="458" text-anchor="middle" font-size="10" fill="#999">the capital city</text>
</svg>
