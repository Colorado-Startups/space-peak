name: secret-scan

# Secret scanning with the MIT-licensed gitleaks BINARY, not the gitleaks
# GitHub Action, which needs a paid licence for organization repositories.
#
# Also standing in for a feature this plan does not have: GitHub's own
# secret scanning requires the Secret Protection add-on, unavailable on
# Free. Scans FULL history, so a credential is caught even if a later
# commit removed it. The tarball is pinned by version and by the SHA-256
# from that release's gitleaks_8.30.1_checksums.txt (read 2026-11-02).
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 15 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          set -euo pipefail
          VER="8.30.1"
          SHA256="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz"
          echo "${SHA256}  /tmp/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Scan full history
        run: gitleaks git --no-banner --redact=100 --verbose --config .gitleaks.toml .
