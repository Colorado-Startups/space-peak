name: secret-scan

# Secret scanning with the MIT-licensed gitleaks BINARY, not the gitleaks
# GitHub Action, which needs a paid licence for organization repositories.
#
# Also standing in for a feature this plan does not have: GitHub's own
# secret scanning requires the Secret Protection add-on, unavailable on
# Free. Scans FULL history, so a credential is caught even if a later
# commit removed it.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 15 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          set -euo pipefail
          VER="8.28.0"
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Scan full history
        run: gitleaks git --no-banner --redact=100 --config .gitleaks.toml .
