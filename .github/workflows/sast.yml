name: sast

# Static analysis over the only executable surface here: the Python in
# 04_tools/, the shell in .githooks/ and .github/scripts/, and any
# JavaScript inside the site-map HTML. Stands in for CodeQL, which needs
# the Code Security add-on that Free does not include.
on:
  pull_request:
    paths: ["**/*.py", "**/*.sh", "**/*.html", ".githooks/**"]
  schedule:
    - cron: "0 16 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sast:
    name: sast
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Shell syntax and shellcheck
        run: |
          set -uo pipefail
          rc=0
          while IFS= read -r f; do
            bash -n "$f" || { echo "::error file=$f::bash syntax error"; rc=1; }
          done < <(git ls-files '*.sh' '.githooks/*')
          if command -v shellcheck >/dev/null 2>&1; then
            git ls-files '*.sh' | xargs -r shellcheck -S warning || rc=1
          fi
          exit $rc
      - name: Python compile
        run: python3 -m compileall -q 04_tools/
      - name: Semgrep
        run: |
          python3 -m pip install --quiet semgrep
          semgrep --config p/ci --config p/python --error --quiet .
