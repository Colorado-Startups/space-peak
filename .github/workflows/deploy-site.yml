name: deploy-site

# STAGED AND INERT. Manual trigger only.
#
# No push trigger and no schedule, deliberately. MASTER_PLAN.md UA 3.2
# makes publication a human action: nothing ships without Paul reading it
# and saying so. A workflow firing on merge would quietly move that
# decision into a git operation.
#
# Nothing is wired: no Cloudflare Pages project, no CLOUDFLARE_API_TOKEN
# or CLOUDFLARE_ACCOUNT_ID secret, no domain. The job fails fast and
# explains itself rather than half-deploying.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type PUBLISH to confirm this is an intentional publication'
        required: true
        default: ''

permissions:
  contents: read

jobs:
  deploy:
    name: deploy-site
    runs-on: ubuntu-latest
    steps:
      - name: Confirm intent
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "PUBLISH" ]; then
            echo "::error::Type PUBLISH to confirm. See MASTER_PLAN.md UA 3.2."
            exit 1
          fi
      - name: Check the pipeline is configured
        run: |
          echo "::error::deploy-site is staged but not configured."
          echo "Before this can run, all of the following must exist:"
          echo "  1. A Cloudflare Pages project for Space Peak"
          echo "  2. Repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID"
          echo "  3. A wrangler.toml naming the project"
          echo "  4. A decision recorded under MASTER_PLAN.md UA 3.2"
          echo "Each is a deliberate step, not a default. Nothing was deployed."
          exit 1
